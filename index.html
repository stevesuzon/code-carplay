<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#b40000"><title>CarPlay Travaille</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#05070b;color:#fff}body{padding:20px 14px}.wrap{max-width:720px;margin:auto}.notice,.card{border:3px solid #30394a;border-radius:24px;padding:18px;margin-bottom:15px;background:#0b1019}.notice{text-align:center;border-color:#ffb022;color:#ffd27a;font-weight:900}.header{text-align:center}h1{font-size:34px;margin:15px 0 4px}.subtitle{color:#bbb}.label{font-size:18px;font-weight:900;margin:20px 0 8px}input{width:100%;height:72px;border:3px solid #ff3434;background:#030509;color:#fff;border-radius:18px;text-align:center;font-size:30px;font-weight:900;letter-spacing:4px;text-transform:uppercase}.buttons{display:grid;gap:12px;margin-top:15px}button{border:0;border-radius:18px;min-height:70px;color:#fff;font-size:20px;font-weight:900}.year{background:#176be0}.life{background:#0c9852}.unlock{background:#c87500}.erase{background:#202733}.result{display:none;margin-top:16px;border:3px solid #f0a529;border-radius:20px;padding:18px;text-align:center}.result.show{display:block}.code{font-size:42px;letter-spacing:5px;font-weight:1000}.status{text-align:center;font-weight:900;margin-top:12px;min-height:24px}.copy{width:100%;background:#d51c1c}</style></head><body><div class="wrap"><div class="notice">CHAQUE CODE EST VALABLE POUR<br>1 AUTORADIO ET 1 TÉLÉPHONE</div><div class="header"><h1>CarPlay Travaille</h1><div class="subtitle">Générateur privé</div></div><div class="card"><div class="label">SECRET ADMINISTRATEUR</div><input id="secret" type="password" autocomplete="current-password"><div class="label">CODE UNIQUE À FOURNIR</div><input id="req" inputmode="text" autocomplete="off" maxlength="7"><div class="buttons"><button class="year" id="yearBtn">ACTIVER 365 JOURS</button><button class="life" id="lifeBtn">ACTIVER À VIE</button><button class="unlock" id="unlockBtn">🔓 CODE DE DÉBLOCAGE</button><button class="erase" id="eraseBtn">EFFACER</button></div><div id="result" class="result"><div>CODE À DONNER</div><div id="out" class="code">--- ---</div><div id="type"></div><button id="copyBtn" class="copy">COPIER LE CODE</button></div><div id="status" class="status"></div></div></div><script>const API='https://carplay-telephone.appli-suzon.workers.dev';const $=id=>document.getElementById(id);function clean(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}function format(v){v=clean(v);return v.length>3?v.slice(0,3)+' '+v.slice(3):v}function randomCode(){const letters='ABCDEFGHJKLMNPQRSTUVWXYZ',digits='0123456789',all=letters+digits;let a=[letters[Math.floor(Math.random()*letters.length)],digits[Math.floor(Math.random()*10)]];while(a.length<6)a.push(all[Math.floor(Math.random()*all.length)]);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('')}function newCode(){const c=randomCode();$('req').value=format(c);return c}$('req').addEventListener('input',e=>e.target.value=format(e.target.value));newCode();async function call(path,payload){const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+$('secret').value},body:JSON.stringify(payload)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw j;return j}function display(code,label){$('out').textContent=format(code);$('type').textContent=label;$('result').classList.add('show');$('status').textContent=''}async function create(life){$('result').classList.remove('show');$('status').textContent='RECHERCHE D’UN CODE LIBRE…';for(let essai=1;essai<=30;essai++){const code=randomCode();$('req').value=format(code);try{await call('/api/admin/subscriptions',{code,lifetime:life,days:365});display(code,life?'LICENCE À VIE — 1 AUTORADIO + 1 TÉLÉPHONE':'LICENCE 365 JOURS — 1 AUTORADIO + 1 TÉLÉPHONE');return}catch(e){if(e.error==='CODE_DEJA_UTILISE'){continue}$('status').textContent=e.error==='SECRET_INCORRECT'?'SECRET ADMINISTRATEUR INCORRECT':(e.error||'ERREUR SERVEUR');return}}$('status').textContent='IMPOSSIBLE DE TROUVER UN CODE LIBRE — RÉESSAYEZ'}$('yearBtn').onclick=()=>create(false);$('lifeBtn').onclick=()=>create(true);$('unlockBtn').onclick=async()=>{const code=clean($('req').value);if(code.length!==6){$('status').textContent='CODE INVALIDE';return}try{await call('/api/admin/subscriptions/action',{code,action:'reset_devices'});display(code,'CODE DÉBLOQUÉ — 1 AUTORADIO + 1 TÉLÉPHONE')}catch(e){$('status').textContent=e.error==='CODE_INTROUVABLE'?'CODE INTROUVABLE':e.error==='SECRET_INCORRECT'?'SECRET ADMINISTRATEUR INCORRECT':(e.error||'ERREUR SERVEUR')}};$('eraseBtn').onclick=()=>{newCode();$('result').classList.remove('show');$('status').textContent=''};$('copyBtn').onclick=async()=>{const code=clean($('out').textContent);if(code.length===6)await navigator.clipboard.writeText(code)};</script></body></html>
