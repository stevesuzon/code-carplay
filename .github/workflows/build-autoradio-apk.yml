name: Build Couteau Suisse Autoradio APK

on:
  push:
    paths:
      - "autoradio/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-autoradio-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed installable APK
        run: gradle :autoradio:assembleRelease --no-daemon
      - name: Prepare APK
        run: cp autoradio/build/outputs/apk/release/autoradio-release.apk Couteau-Suisse-Autoradio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Couteau-Suisse-Autoradio
          path: Couteau-Suisse-Autoradio.apk
          if-no-files-found: error
